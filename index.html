<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Job Application Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="application-container">
      <h1>JOB APPLICATION FORM</h1>
      <p>Apply for your Desired position.</p>
      <form
        id="applicationForm"
        action="https://formspree.io/f/mbggopqr"
        method="post"
        enctype="multipart/form-data"
      >
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your full name"
        />
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
        />
        <label for="phone">Phone Number</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="Enter your phone number"
        />
        <label for="position">Position</label>
        <select id="position" name="position">
          <option value="">Select a position</option>
          <option value="frontend">Frontend Developer</option>
          <option value="designer">UI/UX Designer</option>
          <option value="content">Content Creator</option>
        </select>
        <label for="experience">Years of experience</label>
        <input
          type="number"
          id="experience"
          name="experience"
          min="0"
          placeholder="e.g. 2"
        />
        <label for="resume">Resume Link</label>
        <input
          type="url"
          id="resume"
          name="resume"
          placeholder="Paste your Google Drive resume link"
          required
        />
        <label class="terms">
          <input type="checkbox" id="terms" name="terms" value="agreed" />
          I agree to the terms and conditions.
        </label>
        <button type="submit">Submit Application</button>
        <p id="message"></p>
      </form>
    </main>
    <script src="script.js"></script>
  </body>
</html>
